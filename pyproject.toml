[project]
name = "laya-vision-stitch"
version = "0.1.0"
description = "Offline experiments connecting frozen visual features to frozen Laya through fitted latent mappings"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2", "pillow>=12"]

[project.optional-dependencies]
models = ["mlx-vlm==0.7.1", "laya-coreml==0.1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.15.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["laya_vision_stitch"]
