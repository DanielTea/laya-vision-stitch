[project]
name = "laya-vision-stitch"
version = "0.1.0"
description = "Local Qwen-to-Laya visual stitching with frozen backbones, small adapters and offline distillation"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2", "pillow>=12"]

[project.optional-dependencies]
models = ["mlx-vlm==0.7.1", "laya-coreml==0.1.0"]
stitch = [
    "laya-mlx==0.2.0",
]
data = [
    "av>=14,<17",
    "protobuf>=5,<8",
    "requests>=2.32,<3",
    "huggingface-hub>=0.30,<2",
    "mcap>=1.3,<2",
    "zstandard>=0.23,<1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.15.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts", "models", "laya_vision_stitch/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["laya_vision_stitch"]
